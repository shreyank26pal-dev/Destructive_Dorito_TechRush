<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SecureBank — Passwordless Auth{% endblock %}</title>

  <!-- Google Fonts & Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="flex flex-col min-h-screen">

  <!-- Navigation Header -->
  <header class="border-b border-white/10 backdrop-blur-md bg-slate-950/60 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-emerald-400 p-0.5 shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
            <i class="fas fa-shield-halved text-indigo-400 text-lg group-hover:text-emerald-400 transition-colors"></i>
          </div>
        </div>
        <div>
          <span class="text-xl font-bold font-heading bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">SecureBank</span>
          <span class="block text-[10px] text-indigo-400 tracking-wider uppercase font-semibold">Passwordless Core</span>
        </div>
      </a>

      <!-- Right Navigation & User Status -->
      <div class="flex items-center gap-4">
        <!-- Fingerprint Indicator -->
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs text-gray-400">
          <i class="fas fa-fingerprint text-indigo-400 animate-pulse"></i>
          <span>Device ID:</span>
          <span id="fp-display" class="font-mono text-gray-300">detecting...</span>
        </div>

        <!-- User Badge & Menu -->
        <div id="nav-user-badge" class="hidden flex items-center gap-3 pl-3 border-l border-white/10">
          <a href="/dashboard" class="flex items-center gap-2 text-sm font-medium text-gray-300 hover:text-white transition-colors">
            <div class="w-8 h-8 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-300">
              <i class="fas fa-user-circle"></i>
            </div>
            <span id="nav-user-name">User</span>
          </a>
          <button onclick="handleLogout()" title="Sign Out" class="p-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 text-xs transition-colors">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/10 bg-slate-950/40 py-6 text-center text-xs text-gray-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p>&copy; 2026 SecureBank Demo. Zero Passwords. Pure Cryptographic Auth.</p>
      <div class="flex items-center gap-4 text-gray-400">
        <span class="flex items-center gap-1.5"><i class="fas fa-fingerprint text-indigo-400"></i> WebAuthn / FIDO2</span>
        <span class="flex items-center gap-1.5"><i class="fas fa-envelope-open-text text-emerald-400"></i> Hashed OTP</span>
        <span class="flex items-center gap-1.5"><i class="fas fa-shield-virus text-cyan-400"></i> Device Trust</span>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- App Client Scripts -->
  <script src="/static/js/app.js"></script>
</body>
</html>
