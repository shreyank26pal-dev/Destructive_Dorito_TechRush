<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}APEX BANK — Private Client Vault{% endblock %}</title>

  <!-- Google Fonts & Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="flex flex-col min-h-screen">

  <!-- Institutional Header -->
  <header class="border-b border-white/10 backdrop-blur-xl bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- APEX Bank Brand Logo -->
      <a href="/" class="flex items-center gap-3.5 group">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-amber-500 via-amber-400 to-amber-600 p-0.5 shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
            <i class="fas fa-building-columns text-amber-400 text-xl group-hover:text-amber-300 transition-colors"></i>
          </div>
        </div>
        <div>
          <span class="text-xl font-bold font-heading bg-gradient-to-r from-white via-amber-100 to-amber-400 bg-clip-text text-transparent tracking-wide">APEX BANK</span>
          <div class="flex items-center gap-2">
            <span class="block text-[9px] text-amber-400/90 tracking-widest uppercase font-bold">Private Client Vault</span>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
          </div>
        </div>
      </a>

      <!-- Security & User Status -->
      <div class="flex items-center gap-4">
        <!-- FIDO2 / Device Clearance Badge -->
        <div class="hidden sm:flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-xs text-amber-200">
          <i class="fas fa-shield-halved text-amber-400"></i>
          <span class="font-semibold">Device ID:</span>
          <span id="fp-display" class="font-mono text-amber-300">authenticating...</span>
        </div>

        <!-- Authenticated User Menu -->
        <div id="nav-user-badge" class="hidden flex items-center gap-3 pl-4 border-l border-white/10">
          <a href="/dashboard" class="flex items-center gap-2.5 text-xs font-semibold text-gray-200 hover:text-amber-400 transition-colors">
            <div class="w-8 h-8 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
              <i class="fas fa-user-tie"></i>
            </div>
            <span id="nav-user-name">Private Client</span>
          </a>
          <button onclick="handleLogout()" title="Terminate Vault Session" class="p-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 text-xs transition-colors">
            <i class="fas fa-power-off"></i>
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main Body Content -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Institutional Compliance Footer -->
  <footer class="border-t border-white/10 bg-slate-950/80 py-6 text-center text-xs text-gray-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2 text-gray-400">
        <i class="fas fa-shield-cat text-amber-400 text-base"></i>
        <span>&copy; 2026 APEX Financial Trust. FDIC & FINRA Mocked Security Architecture.</span>
      </div>
      <div class="flex items-center gap-4 text-gray-400 font-medium">
        <span class="flex items-center gap-1.5"><i class="fas fa-fingerprint text-amber-400"></i> FIDO2 / WebAuthn</span>
        <span class="flex items-center gap-1.5"><i class="fas fa-key text-blue-400"></i> Hashed Ephemeral OTP</span>
        <span class="flex items-center gap-1.5"><i class="fas fa-microchip text-emerald-400"></i> Cryptographic Hardware Bound</span>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- App Client Scripts -->
  <script src="/static/js/app.js"></script>
</body>
</html>
