<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Green Circle Container -->
  <circle cx="50" cy="50" r="45" 
          fill="url(#emeraldGrad)" 
          filter="url(#emeraldGlow)"/>

  <!-- Crisp White Solid Triangular Dorito Emblem -->
  <path d="M 50 25 L 74 67 C 75.5 69.5 73.7 73 70.7 73 L 29.3 73 C 26.3 73 24.5 69.5 26 67 Z" 
        fill="#FFFFFF"/>
</svg>
